<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost your breath? — Miracle Breath</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .nf {
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      background:
        radial-gradient(120% 90% at 80% 10%, rgba(155, 196, 207, 0.28), transparent 55%),
        radial-gradient(100% 80% at 10% 90%, rgba(205, 168, 107, 0.20), transparent 50%),
        linear-gradient(180deg, var(--cream-100), var(--cream-50));
      padding: 2rem;
    }
    .nf__orb {
      width: 150px; height: 150px; margin: 0 auto 2rem;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.9), transparent 45%),
        radial-gradient(circle at 70% 75%, var(--sage-400), var(--sage-600) 70%);
      box-shadow: var(--shadow-lg);
      animation: breathe 9s var(--ease) infinite;
    }
    .nf h1 { font-size: clamp(3rem, 8vw, 6rem); margin-bottom: 0.2em; }
    .nf p { color: var(--muted); max-width: 44ch; margin-inline: auto; font-size: 1.15rem; }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <div class="nf__orb" aria-hidden="true"></div>
      <p class="eyebrow center" style="justify-content:center">Error 404</p>
      <h1>Lost your breath?</h1>
      <p>This page seems to have drifted away on the exhale. Let's guide you gently back to calm.</p>
      <p style="margin-top:2rem">
        <a class="btn btn--lg" href="index.html">Return home <span class="arrow">→</span></a>
      </p>
    </div>
  </main>
</body>
</html>
