  name: Samantha Harden
  role: Founder · Certified SOMA Breath Instructor
story:
  eyebrow: My story
  title: How Miracle Breath began
  body: >-
    I'm Samantha, a mum of two boys who loves to horse ride, ski, camp with my
    family and take long walks with our family dog. For fifteen years I worked
    in Private Client Wealth Management in London: long, intensive days, client
    dinners and "work drinks" that slowly take their toll, the kind of pace
    where your sleep, your home life and your sense of yourself all start to
    suffer.


    My youngest was diagnosed with ADHD in 2023 and going through the process
    with him led to my own diagnosis too. Then, in 2024 I was diagnosed with
    breast cancer. The treatment was a lumpectomy and lymph node removal,
    followed by several weeks of intensive radiotherapy. These events pushed my
    ADHD symptoms to an all-time high. On top of everything else I was
    completely burnt out and struggling to cope. I couldn't carry on the way I
    was, so I went looking for something that might help.


    That's when I found SOMA Breath®, and it genuinely changed my life. There's
    a point in radiotherapy where you're asked to hold your breath to shield
    your heart and keep the treatment accurate. Under that kind of stress I'd
    found it almost impossible, and my treatment had to restart, but with
    breathwork my breath-hold improved remarkably quickly. Better sleep, a
    calmer nervous system, room to actually feel things: all of it helped me
    rebuild.


    These days I no longer take ADHD or anxiety medication, and I feel calm,
    happy and focused. I trained as a SOMA Breath instructor so I could offer
    the same thing to other people, whether you're navigating neurodiversity,
    recovering from something hard, or simply spinning too many plates.
  signature: Samantha
approach:
  eyebrow: What to expect
  title: What it's actually like
  intro: No experience needed, no pressure and no judgement. Just a supportive
    space and the gentle guidance of your own breath.
  cards:
    - title: Grounded & welcoming
      text: Every session is beginner-friendly and fully guided. Come exactly as you
        are, whether you're curious, sceptical or somewhere in between.
    - title: Modern meets ancient
      text: The work blends modern, evidence-informed breathing techniques with the
        calm and intention of ancient practice.
    - title: Inclusive & supportive
      text: Especially mindful of neurodiversity, overwhelm and high-pressure lives,
        and adapted to how you feel on the day.
first_session:
  eyebrow: Your first time
  title: What to expect in a session
  intro: A little reassurance, because the unknown is the hardest part. Here's
    roughly how it goes.
  items:
    - icon: tick
      title: Just wear comfy clothes
      text: Lie down or sit. Mats and blankets provided in person; a quiet spot is all
        you need online.
    - icon: video
      title: Camera off is fine
      text: Online sessions are camera-optional. Keep yours off and simply follow my
        voice.
    - icon: heart
      title: Emotion is welcome
      text: Some people feel energised, some feel tearful, some drift off. All of it
        is completely normal.
qualifications:
  eyebrow: Training & credentials
  title: Qualified, certified and always learning
  intro: Samantha holds the following professional qualifications.
  items:
    - icon: award
      title: Certified SOMA Breath Instructor
      text: 45 hours of instructor training and certification in the SOMA Breath
        method, qualified to teach and guide rhythmic breathwork, meditation and
        journey experiences safely.
      certificate: /assets/docs/samantha-harden-soma-breath-instructor.pdf
    - icon: certificate
      title: ADHD Awareness Diploma
      text: A CPD-certified diploma from New Skills Academy giving a specialist
        understanding of attention, focus and neurodiversity, which shapes a
        genuinely inclusive, ADHD-friendly approach to breathwork.
      certificate: /assets/docs/samantha-harden-adhd-awareness-diploma.pdf
quote:
  text: '"Your breath is always with you. Learning to use it well can change
    everything."'
  cite: Samantha Harden · Founder of Miracle Breath
