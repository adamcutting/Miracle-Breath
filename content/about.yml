seo:
  title: About Samantha Harden | Miracle Breath
  description: Meet Samantha Harden, founder of Miracle Breath. A certified SOMA
    Breath® instructor with an ADHD Awareness Diploma, helping people find calm,
    healing and transformation through conscious breathing.
