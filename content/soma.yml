    - icon: leaf
      colour: green
      title: Less stress
      text: A nervous system that settles more easily, more often.
    - icon: bolt
      colour: gold
      title: More energy
      text: A natural sense of vitality and aliveness that lasts beyond the session.
    - icon: smile
