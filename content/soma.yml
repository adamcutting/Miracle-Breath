try_it:
  eyebrow: Experience a moment
  title: Try a guided breath
  intro: A simple taste of rhythmic breathing. Choose a pattern and follow the circle — full SOMA journeys go much deeper.
  note: A gentle taster, not medical advice. Please don't practise while driving; if you feel light-headed, simply return to normal breathing.
notice:
  title: Important information
  text: Breathwork is generally safe and gentle, but some techniques aren't suitable for everyone. If you are pregnant or have a heart condition, epilepsy, high blood pressure or a respiratory condition, please speak with Samantha and your GP before taking part. You'll be asked to read and sign the participation and waiver agreement before your first session.
  document: /assets/docs/miracle-breath-participation-waiver.pdf
  link_label: Read the participation & waiver agreement (PDF)
