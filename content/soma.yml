seo:
  title: What is SOMA Breath? — Miracle Breath
  description: SOMA Breath is a guided breathwork method combining rhythmic breathing, breath retention, meditation, music and visualisation — blending ancient pranayama with modern science.
hero:
  title: What is SOMA Breath®?
  intro: A dynamic breathwork practice that brings together rhythmic breathing, music, meditation and visualisation to create a powerful mind-body experience.
intro:
  eyebrow: The method
  quote: SOMA Breath is a dynamic breathwork practice that combines guided rhythmic breathing, music, meditation and visualisation. Inspired by ancient breathing traditions and shaped for modern life, it is designed to help improve focus, reduce stress, increase energy and support a deeper sense of inner balance.
elements:
  eyebrow: How it works
  title: Five elements, woven into one experience
  intro: Each session layers these together, gently guiding your body and mind into a deeply restorative state.
  cards:
    - title: Rhythmic breathing
      text: Structured, musical breathing patterns that energise the body and bring the nervous system into a balanced rhythm.
    - title: Breath retention
      text: Comfortable, guided breath holds that train resilience and invite a profound sense of stillness and clarity.
    - title: Meditation
      text: Moments of focused awareness that quiet mental chatter and deepen your connection to the present.
    - title: Music & sound
      text: Carefully composed soundscapes that carry the practice, set the pace and help you drop into the experience.
    - title: Visualisation
      text: Gentle guided imagery that channels intention, supports healing and leaves you feeling renewed.
band:
  image: /assets/photos/ambient-bowl.jpg
  eyebrow: Carried by sound
  quote: Music and resonance guide the breath, and the breath guides you home.
  cite: ""
science:
  eyebrow: Ancient wisdom, modern science
  title: Time-honoured breath, understood anew
  body: |-
    SOMA Breath draws on pranayama-based breathing techniques refined over thousands of years, and pairs them with our modern understanding of the body, the nervous system and the power of music and sound.

    SOMA Breath was developed by Niraj Naik and is taught by certified facilitators and instructors worldwide. The result is a practice that feels both grounding and credible. It's gentle enough for beginners, solid enough to trust, and made for a busy life.
  small_print: SOMA Breath® is a registered method; Samantha is a certified SOMA Breath instructor.
  button:
    label: See how it supports healing
    link: /healing.html
