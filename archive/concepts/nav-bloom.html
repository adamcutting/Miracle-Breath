<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Miracle Breath — Concept: Bloom Navigation</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="../assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap" rel="stylesheet" />
<style>
  :root{--gold:#e9b94e;--lilac:#7a6fb0;--ink:#322e4a;--font-d:"Fraunces",Georgia,serif;--font-b:"Nunito Sans",system-ui,sans-serif;--ease:cubic-bezier(.34,1.4,.5,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-b);color:var(--ink);overflow:hidden;height:100svh;-webkit-font-smoothing:antialiased;
    background:radial-gradient(60% 60% at 20% 18%,#d9c8f0,transparent 60%),radial-gradient(58% 58% at 82% 22%,#bfe3ec,transparent 60%),radial-gradient(66% 60% at 75% 88%,#f6d9c6,transparent 60%),radial-gradient(60% 60% at 22% 88%,#cdeede,transparent 60%),linear-gradient(160deg,#f1eafc,#fbfaff)}
  a{color:inherit;text-decoration:none}
  .sparkles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .sparkle{position:absolute;width:6px;height:6px;border-radius:50% 50% 50% 0;background:radial-gradient(circle at 30% 30%,#fff,var(--gold));opacity:0;filter:drop-shadow(0 0 6px rgba(233,185,78,.8));animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(105vh) scale(.6);opacity:0}10%{opacity:.9}100%{transform:translateY(-10vh) scale(1.1);opacity:0}}

  .back{position:fixed;top:1.1rem;left:clamp(1rem,4vw,2rem);z-index:40;font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;opacity:.6;transition:.3s}
  .back:hover{opacity:1;color:var(--lilac)}
  .brandmark{position:fixed;top:1.1rem;right:clamp(1rem,4vw,2rem);z-index:40;display:flex;align-items:center;gap:.5rem;font-family:var(--font-d);font-weight:600}
  .brandmark img{width:30px;height:30px}

  .stage{position:relative;height:100svh;display:grid;place-items:center;z-index:1}
  .caption{position:absolute;top:calc(50% - min(34vmin,230px));left:50%;transform:translateX(-50%);text-align:center;width:min(40ch,86vw);transition:opacity .4s}
  .caption .eyebrow{font-weight:800;letter-spacing:.3em;text-transform:uppercase;font-size:.72rem;color:#8a6a28;margin-bottom:.6rem}
  .caption h1{font-family:var(--font-d);font-weight:600;font-size:clamp(1.6rem,1.1rem+2vw,2.6rem);line-height:1.1;color:#2c2746}
  .open .caption{opacity:0}

  .bloom{position:relative;width:1px;height:1px}
  .trigger{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:118px;height:118px;border-radius:50%;border:none;cursor:pointer;z-index:5;
    background:radial-gradient(circle at 35% 30%,#fff,#f3ead0 40%,var(--gold));box-shadow:0 14px 40px rgba(233,185,78,.5),inset 0 0 26px rgba(255,255,255,.6);display:grid;place-items:center;transition:transform .4s var(--ease),box-shadow .4s}
  .trigger img{width:62%;transition:opacity .3s}
  .trigger .x{position:absolute;width:26px;height:26px;opacity:0;transition:opacity .3s}
  .trigger .x::before,.trigger .x::after{content:"";position:absolute;inset:0 50%;width:2.5px;background:#7a5a16;border-radius:2px}
  .trigger .x::before{transform:rotate(45deg)}.trigger .x::after{transform:rotate(-45deg)}
  .trigger:hover{transform:translate(-50%,-50%) scale(1.05)}
  .open .trigger img{opacity:0}.open .trigger .x{opacity:1}
  .trigger-label{position:absolute;top:calc(50% + 80px);left:50%;transform:translateX(-50%);font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--lilac);opacity:.8;transition:opacity .3s}
  .open .trigger-label{opacity:0}

  .petal{position:absolute;top:50%;left:50%;width:104px;height:104px;border-radius:50%;
    transform:translate(-50%,-50%) scale(0);opacity:0;transition:transform .55s var(--ease),opacity .4s;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;text-align:center;cursor:pointer;
    background:rgba(255,255,255,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.8);box-shadow:0 12px 30px rgba(122,111,176,.22);color:#3a3454}
  .petal svg{width:24px;height:24px;color:var(--lilac)}
  .petal .pl{font-weight:800;font-size:.74rem;letter-spacing:.02em}
  .petal:hover{background:#fff;box-shadow:0 16px 40px rgba(122,111,176,.35)}
  .petal:hover svg{color:var(--gold)}
  .open .petal{opacity:1;transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(1)}

  .hint{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);z-index:20;font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--lilac);opacity:.55}

  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:opacity .2s!important}.open .petal{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty)))!important}}
  @media(max-width:560px){.petal{width:88px;height:88px}.petal .pl{font-size:.68rem}.trigger{width:100px;height:100px}}
</style>
</head>
<body>
  <a class="back" href="index.html">← All concepts</a>
  <span class="brandmark"><img src="../assets/img/emblem-sm.png" alt=""/>Miracle Breath</span>
  <div class="sparkles" id="sparkles" aria-hidden="true"></div>

  <div class="stage" id="stage">
    <div class="caption">
      <p class="eyebrow">Miracle Breath</p>
      <h1>Transformational breathwork for healing, balance, energy and inner change.</h1>
    </div>

    <nav class="bloom" id="bloom" aria-label="Bloom menu">
      <button class="trigger" id="trigger" type="button" aria-expanded="false" aria-label="Open menu">
        <img src="../assets/img/emblem-sm.png" alt=""/><span class="x" aria-hidden="true"></span>
      </button>
      <span class="trigger-label">Tap to open</span>
      <!-- petals injected -->
    </nav>
  </div>
  <p class="hint" aria-hidden="true">Tap the seed-head to bloom the menu</p>

<script>
(function(){
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var ic={
    home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
    about:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21v-1a7 7 0 0 1 14 0v1"/></svg>',
    soma:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c3-6 15-6 18 0-3 6-15 6-18 0Z"/><circle cx="12" cy="12" r="2.5"/></svg>',
    healing:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.5-9 9-9 9Z"/></svg>',
    timetable:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    contact:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>'
  };
  var items=[
    {k:"home",label:"Home",href:"../index.html"},
    {k:"about",label:"About",href:"../about.html"},
    {k:"soma",label:"SOMA",href:"../soma-breath.html"},
    {k:"healing",label:"Healing",href:"../healing.html"},
    {k:"timetable",label:"Sessions",href:"../timetable.html"},
    {k:"contact",label:"Contact",href:"../contact.html"}
  ];
  var bloom=document.getElementById("bloom"),trigger=document.getElementById("trigger"),stage=document.getElementById("stage");
  var R=window.innerWidth<560?130:165;
  var petals=items.map(function(it,i){
    var a=(-90+i*(360/items.length))*Math.PI/180;
    var p=document.createElement("a");p.className="petal";p.href=it.href;
    p.style.setProperty("--tx",(Math.cos(a)*R)+"px");
    p.style.setProperty("--ty",(Math.sin(a)*R)+"px");
    p.style.transitionDelay=(i*0.05)+"s";
    p.innerHTML=ic[it.k]+'<span class="pl">'+it.label+'</span>';
    bloom.appendChild(p);return p;
  });
  function recalc(){R=window.innerWidth<560?130:165;items.forEach(function(it,i){var a=(-90+i*(360/items.length))*Math.PI/180;petals[i].style.setProperty("--tx",(Math.cos(a)*R)+"px");petals[i].style.setProperty("--ty",(Math.sin(a)*R)+"px");});}
  addEventListener("resize",recalc);
  var open=false;
  function toggle(){open=!open;stage.classList.toggle("open",open);trigger.setAttribute("aria-expanded",open?"true":"false");}
  trigger.addEventListener("click",toggle);
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&open)toggle();});

  if(!reduce){var sp=document.getElementById("sparkles");for(var i=0;i<16;i++){var s=document.createElement("span");s.className="sparkle";s.style.left=Math.random()*100+"%";s.style.animationDuration=(12+Math.random()*12)+"s";s.style.animationDelay=(-Math.random()*18)+"s";s.style.transform="scale("+(.5+Math.random())+")";sp.appendChild(s);}}
})();
</script>
</body>
</html>
