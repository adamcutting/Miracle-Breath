<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Miracle Breath — Concept: Breath Field (mobile-first)</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0e3a38" />
<link rel="icon" type="image/png" href="../assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap" rel="stylesheet" />
<style>
  :root{--gold:#f2c45a;--aqua:#5fd0c5;--font-d:"Fraunces",Georgia,serif;--font-b:"Nunito Sans",system-ui,sans-serif;--ease:cubic-bezier(.22,1,.36,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font-b);color:#eaf5f2;background:#0b2c2a;overflow:hidden;-webkit-font-smoothing:antialiased;
    overscroll-behavior:none;touch-action:none}
  a{color:inherit;text-decoration:none}
  #bg{position:fixed;inset:0;z-index:0}
  #dust{position:fixed;inset:0;z-index:1;pointer-events:none}

  .bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;
    padding:calc(env(safe-area-inset-top,0) + .9rem) 1.2rem .9rem}
  .bar .b{font-family:var(--font-d);font-weight:600;display:flex;align-items:center;gap:.45rem;font-size:1.02rem}.bar .b img{width:28px;height:28px}
  .bar a.back{font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.6}

  .stage{position:relative;z-index:3;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:5.5rem 1.4rem calc(env(safe-area-inset-bottom,0) + 5.5rem)}
  .logo{width:min(260px,64vw);margin:0 auto 1.1rem;filter:drop-shadow(0 0 50px rgba(242,196,90,.5));will-change:transform}
  .eyebrow{font-weight:800;letter-spacing:.3em;text-transform:uppercase;font-size:.7rem;color:var(--gold);margin-bottom:.8rem}
  h1{font-family:var(--font-d);font-weight:600;line-height:1.04;letter-spacing:-.02em;font-size:clamp(2.2rem,6.5vw,3.4rem);color:#fff;max-width:16ch}
  h1 em{font-style:italic;background:linear-gradient(100deg,var(--aqua),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{color:#bfe0db;font-size:1.02rem;margin-top:.9rem;max-width:30ch}
  .cta{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;margin-top:1.5rem;min-height:52px;padding:.95rem 2rem;border-radius:999px;
    background:linear-gradient(135deg,var(--gold),#ffd877);color:#0e3a38;font-weight:800;font-size:1.02rem;box-shadow:0 14px 40px rgba(242,196,90,.4)}
  .cta:active{transform:scale(.97)}

  .tools{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0) + .8rem);z-index:11;display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;padding:0 1rem}
  .pill{display:inline-flex;align-items:center;gap:.45rem;min-height:44px;padding:.5rem 1rem;border-radius:999px;font-size:.8rem;font-weight:800;
    background:rgba(14,58,56,.55);backdrop-filter:blur(12px);border:1px solid rgba(95,208,197,.35);color:#eaf5f2}
  .pill.on{background:var(--gold);color:#0e3a38;border-color:var(--gold)}
  .pill[hidden]{display:none}
  .hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0) + 3.6rem);transform:translateX(-50%);z-index:10;
    font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:#bfe0db;opacity:.7;text-align:center;width:90%}
  .switch{position:fixed;top:calc(env(safe-area-inset-top,0) + 3.2rem);left:50%;transform:translateX(-50%);z-index:11;display:flex;gap:.3rem;
    background:rgba(14,58,56,.5);backdrop-filter:blur(10px);border:1px solid rgba(95,208,197,.3);padding:.3rem;border-radius:999px;font-size:.72rem;font-weight:800}
  .switch a{padding:.35rem .7rem;border-radius:999px;opacity:.6}.switch a.cur{background:var(--gold);color:#0e3a38;opacity:1}
  @media(prefers-reduced-motion:reduce){.logo{will-change:auto}}
</style>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <canvas id="dust" aria-hidden="true"></canvas>

  <header class="bar">
    <span class="b"><img src="../assets/img/emblem-sm.png" alt=""/>Miracle Breath</span>
    <a class="back" href="index.html">← concepts</a>
  </header>
  <nav class="switch" aria-label="Concepts"><a href="wow-aurora.html">Aurora</a><a href="wow-dust.html">Dust</a><a href="wow-mobile.html" class="cur">Mobile</a></nav>

  <div class="stage">
    <picture><source srcset="../assets/img/logo-full.webp" type="image/webp"><img class="logo" id="logo" src="../assets/img/logo-full.png" alt="Miracle Breath"/></picture>
    <p class="eyebrow">Made for your hands</p>
    <h1>Drag through the dust. <em>Tilt to drift.</em></h1>
    <p class="lead">Swipe a finger across the seeds, tip your phone, then hold still and watch them settle.</p>
    <a class="cta" href="../timetable.html">Find a session →</a>
  </div>

  <p class="hint" id="hint" aria-hidden="true">Drag through the dust · tap to puff · hold still to settle</p>
  <div class="tools">
    <button class="pill" id="motionBtn" type="button" hidden>✦ Enable tilt</button>
  </div>

<script>
(function(){
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var dpr=Math.min(devicePixelRatio||1,2);

  /* ---------- background: deep jewel glow that breathes ---------- */
  var bg=document.getElementById("bg"),bx=bg.getContext("2d"),W,H;
  function rs(){W=bg.width=innerWidth*dpr;H=bg.height=innerHeight*dpr;bg.style.width=innerWidth+"px";bg.style.height=innerHeight+"px";build();}
  function hx(c,a){var n=parseInt(c.slice(1),16);return"rgba("+(n>>16)+","+((n>>8)&255)+","+(n&255)+","+a+")";}
  function drawBg(t,breath,wx,wy){
    bx.globalCompositeOperation="source-over";bx.fillStyle="#0b2624";bx.fillRect(0,0,W,H);
    bx.globalCompositeOperation="lighter";
    var pts=[["#14524c",.7,.3,.3],["#123b5a",.6,.7,.6],["#0e6b62",.6,.5,.8]];
    if(bx.filter!==undefined)bx.filter="blur("+(70*dpr)+"px)";
    pts.forEach(function(p,i){var x=(p[2]+Math.sin(t*0.05+i)*0.12+wx*0.06)*W,y=(p[3]+Math.cos(t*0.05+i)*0.12+wy*0.06)*H,r=Math.max(W,H)*0.5;
      var g=bx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,hx(p[0],p[1]));g.addColorStop(1,hx(p[0],0));bx.fillStyle=g;bx.beginPath();bx.arc(x,y,r,0,6.2832);bx.fill();});
    if(bx.filter!==undefined)bx.filter="none";
    // central gold glow, breathes
    var cg=bx.createRadialGradient(W/2+wx*40*dpr,H*0.4+wy*40*dpr,0,W/2,H*0.4,Math.max(W,H)*(0.16+0.05*breath));
    cg.addColorStop(0,"rgba(242,196,90,"+(0.10+0.08*breath)+")");cg.addColorStop(1,"rgba(242,196,90,0)");
    bx.fillStyle=cg;bx.fillRect(0,0,W,H);
  }

  /* ---------- dust particles ---------- */
  var dc=document.getElementById("dust"),dx=dc.getContext("2d"),seeds=[],N;
  var cxp,cyp,R;
  function build(){
    dc.width=W;dc.height=H;dc.style.width=innerWidth+"px";dc.style.height=innerHeight+"px";
    cxp=W*0.5;cyp=H*0.4;R=Math.min(W,H)*0.30;N=innerWidth<480?40:58;
    seeds=[];for(var i=0;i<N;i++){var a=(i/N)*6.2832+Math.random()*.2,rr=R*(0.82+Math.random()*0.42);
      var hxp=cxp+Math.cos(a)*rr,hyp=cyp+Math.sin(a)*rr*0.95;
      seeds.push({x:hxp+(Math.random()-.5)*70*dpr,y:hyp+(Math.random()-.5)*70*dpr,vx:0,vy:0,hx:hxp,hy:hyp,s:(0.7+Math.random()*0.9)*dpr});}
  }
  rs();addEventListener("resize",rs);

  /* ---------- input: pointer (touch+mouse) drag scatter + tap puff ---------- */
  var pact=false,px=-9999,py=-9999,lastMove=-9999,downAt=0,downX=0,downY=0;
  function pos(e){return {x:(e.clientX)*dpr,y:(e.clientY)*dpr};}
  addEventListener("pointerdown",function(e){pact=true;var p=pos(e);px=p.x;py=p.y;downAt=performance.now();downX=e.clientX;downY=e.clientY;lastMove=downAt;},{passive:true});
  addEventListener("pointermove",function(e){var p=pos(e);px=p.x;py=p.y;lastMove=performance.now();
    if(e.pointerType==="mouse")pact=true;},{passive:true});
  addEventListener("pointerup",function(e){
    var dt=performance.now()-downAt,mv=Math.hypot(e.clientX-downX,e.clientY-downY);
    if(dt<260&&mv<14){ // tap = puff
      var ix=e.clientX*dpr,iy=e.clientY*dpr;
      seeds.forEach(function(s){var ddx=s.x-ix,ddy=s.y-iy,d=Math.hypot(ddx,ddy)||1;if(d<R*1.1){var f=(1-d/(R*1.1))*9*dpr;s.vx+=ddx/d*f;s.vy+=ddy/d*f;}});
    }
    if(e.pointerType!=="mouse"){pact=false;px=py=-9999;}
  },{passive:true});

  /* ---------- device tilt (gyro) ---------- */
  var windX=0,windY=0,twX=0,twY=0,tiltOn=false;
  function onTilt(e){
    if(e.gamma==null)return;
    twX=Math.max(-1,Math.min(1,e.gamma/28));        // left-right
    twY=Math.max(-1,Math.min(1,((e.beta||45)-45)/28)); // front-back around upright
  }
  var btn=document.getElementById("motionBtn");
  var hasDO="DeviceOrientationEvent" in window;
  var needsPerm=hasDO&&typeof DeviceOrientationEvent.requestPermission==="function";
  if(hasDO&&matchMedia("(pointer:coarse)").matches&&!reduce){
    if(needsPerm){btn.hidden=false;btn.addEventListener("click",function(){
      DeviceOrientationEvent.requestPermission().then(function(r){if(r==="granted"){addEventListener("deviceorientation",onTilt);tiltOn=true;btn.classList.add("on");btn.textContent="✦ Tilt on";setTimeout(function(){btn.hidden=true;},1200);}}).catch(function(){});
    });}
    else{addEventListener("deviceorientation",onTilt);tiltOn=true;}
  }

  /* ---------- loop ---------- */
  var logo=document.getElementById("logo");
  var Rrep=130*dpr,Rrep2=Rrep*Rrep,start=performance.now();
  function frame(now){
    var t=(now-start)/1000;
    // breath clock 4s in / 6s out
    var ph=(t%10)/10,br;if(ph<0.4)br=ph/0.4;else br=1-(ph-0.4)/0.6;br=br*br*(3-2*br);
    // smooth tilt -> wind
    windX+=(twX-windX)*0.06;windY+=(twY-windY)*0.06;
    drawBg(t,reduce?0.5:br,windX,windY);
    // parallax the logo with tilt
    if(tiltOn)logo.style.transform="translate("+(windX*14)+"px,"+(windY*10)+"px)";
    var idle=(now-lastMove)>1100;
    var springK=idle?0.022:0.007;
    dx.clearRect(0,0,W,H);
    for(var i=0;i<seeds.length;i++){var p=seeds[i];
      if(pact&&px>-9000){var ax=p.x-px,ay=p.y-py,d2=ax*ax+ay*ay;
        if(d2<Rrep2){var d=Math.sqrt(d2)||1,f=(1-d2/Rrep2);f=f*f*3.0*dpr;p.vx+=ax/d*f;p.vy+=ay/d*f;}}
      // gyro drift
      p.vx+=windX*0.10*dpr;p.vy+=windY*0.10*dpr;
      p.vx+=(p.hx-p.x)*springK;p.vy+=(p.hy-p.y)*springK;
      p.vx*=0.9;p.vy*=0.9;p.x+=p.vx;p.y+=p.vy;
      var g=dx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.s*4);
      g.addColorStop(0,"rgba(255,247,225,0.95)");g.addColorStop(0.4,"rgba(242,196,90,0.85)");g.addColorStop(1,"rgba(242,196,90,0)");
      dx.fillStyle=g;dx.beginPath();dx.arc(p.x,p.y,p.s*4,0,6.2832);dx.fill();
    }
    if(!reduce)requestAnimationFrame(frame);
  }
  if(reduce){for(var k=0;k<200;k++)seeds.forEach(function(p){p.vx+=(p.hx-p.x)*0.05;p.vy+=(p.hy-p.y)*0.05;p.vx*=0.6;p.vy*=0.6;p.x+=p.vx;p.y+=p.vy;});drawBg(2,0.5,0,0);dx.clearRect(0,0,W,H);seeds.forEach(function(p){var g=dx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.s*4);g.addColorStop(0,"rgba(255,247,225,.95)");g.addColorStop(.4,"rgba(242,196,90,.85)");g.addColorStop(1,"rgba(242,196,90,0)");dx.fillStyle=g;dx.beginPath();dx.arc(p.x,p.y,p.s*4,0,6.2832);dx.fill();});}
  else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
