<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Miracle Breath — Concept: Aurora Breath (WebGL)</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="../assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#322e4a;--muted:#5f5980;--gold:#e9b94e;--font-d:"Fraunces",Georgia,serif;--font-b:"Nunito Sans",system-ui,sans-serif;--ease:cubic-bezier(.22,1,.36,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-b);color:var(--ink);height:100svh;overflow:hidden;-webkit-font-smoothing:antialiased;
    background:radial-gradient(60% 60% at 20% 20%,#d9c8f0,transparent 60%),radial-gradient(60% 60% at 80% 30%,#bfe3ec,transparent 60%),linear-gradient(160deg,#f1eafc,#fbfaff)}
  a{color:inherit;text-decoration:none}
  #gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
  .seeds{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .seed{position:absolute;width:7px;height:7px;border-radius:50% 50% 50% 0;background:radial-gradient(circle at 30% 30%,#fff,var(--gold));opacity:0;filter:drop-shadow(0 0 6px rgba(233,185,78,.85));animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(105vh) scale(.6);opacity:0}10%{opacity:.9}100%{transform:translateY(-10vh) scale(1.1);opacity:0}}
  .veil{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(120% 90% at 50% 42%,transparent 40%,rgba(251,250,255,.5))}

  .bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:1.1rem clamp(1.2rem,4vw,3rem)}
  .bar .b{font-family:var(--font-d);font-weight:600;display:flex;align-items:center;gap:.5rem}.bar .b img{width:32px;height:32px}
  .bar a.back{font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;opacity:.6}.bar a.back:hover{opacity:1}

  .stage{position:relative;z-index:3;height:100svh;display:grid;place-items:center;text-align:center;padding:1.5rem}
  .inner{max-width:24ch}
  .logo{width:min(330px,70vw);margin:0 auto 1.2rem;filter:drop-shadow(0 16px 44px rgba(122,111,176,.3))}
  .eyebrow{font-weight:800;letter-spacing:.32em;text-transform:uppercase;font-size:.72rem;color:#8a6a28;margin-bottom:.9rem}
  h1{font-family:var(--font-d);font-weight:600;line-height:1.02;letter-spacing:-.02em;font-size:clamp(2.4rem,1.4rem+4.6vw,5rem);color:#2c2746}
  h1 em{font-style:italic;color:#7a6fb0}
  .breathword{margin-top:1.3rem;font-family:var(--font-d);font-style:italic;font-size:1.4rem;color:#6f5fa8;min-height:1.6em;transition:opacity .6s}
  .cta{display:inline-flex;align-items:center;gap:.5rem;margin-top:1.4rem;padding:1rem 2rem;border-radius:999px;background:linear-gradient(135deg,#e9b94e,#f6d989);color:#3a2e12;font-weight:800;box-shadow:0 16px 40px rgba(233,185,78,.4);transition:transform .35s var(--ease)}
  .cta:hover{transform:translateY(-3px)}
  .hint{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);z-index:10;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:#6f5fa8;opacity:.6}
  .switch{position:fixed;bottom:2.6rem;left:50%;transform:translateX(-50%);z-index:11;display:flex;gap:.35rem;background:rgba(255,255,255,.6);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.7);padding:.35rem;border-radius:999px;box-shadow:0 10px 28px rgba(50,46,74,.16);font-size:.76rem;font-weight:800}
  .switch a{padding:.4rem .8rem;border-radius:999px;opacity:.65}.switch a.cur{background:#322e4a;color:#fff;opacity:1}
  @media(prefers-reduced-motion:reduce){.seed{animation:none;display:none}.breathword{opacity:1!important}}
</style>
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="seeds" id="seeds" aria-hidden="true"></div>
  <div class="veil" aria-hidden="true"></div>

  <header class="bar">
    <span class="b"><img src="../assets/img/emblem-sm.png" alt=""/>Miracle Breath</span>
    <a class="back" href="index.html">← all concepts</a>
  </header>

  <div class="stage">
    <div class="inner">
      <picture><source srcset="../assets/img/logo-full.webp" type="image/webp"><img class="logo" src="../assets/img/logo-full.png" alt="Miracle Breath"/></picture>
      <p class="eyebrow">Aurora Breath · move your cursor</p>
      <h1>The light <em>breathes</em> with you.</h1>
      <p class="breathword" id="bw" aria-hidden="true">breathe in…</p>
      <a class="cta" href="../timetable.html">Find a session →</a>
    </div>
  </div>
  <p class="hint" aria-hidden="true">Move the cursor — the aurora follows your breath</p>
  <nav class="switch" aria-label="Premium concepts"><a href="wow-aurora.html" class="cur">Aurora</a><a href="wow-firstlight.html">First Light</a><a href="wow-dust.html">Settling Dust</a></nav>

<script>
(function(){
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cv=document.getElementById("gl");
  var gl=cv.getContext("webgl")||cv.getContext("experimental-webgl");
  if(!gl){cv.style.display="none";return;} // CSS gradient fallback already on body

  var vs="attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
  var fs=[
  "precision highp float;",
  "uniform vec2 uRes;uniform float uTime;uniform float uBreath;uniform vec2 uWind;",
  "float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}",
  "float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);",
  "float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));",
  "return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}",
  "float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.+vec2(7.1,3.3);a*=.5;}return v;}",
  "void main(){",
  "vec2 uv=gl_FragCoord.xy/uRes.xy;vec2 p=uv;p.x*=uRes.x/uRes.y;",
  "float t=uTime*0.05;",
  "vec2 w=uWind*0.6;",
  "vec2 q=vec2(fbm(p*1.6+t+w),fbm(p*1.6-t+vec2(5.2,1.3)));",
  "float warp=fbm(p*1.8+q*1.4+t*0.8+w);",
  "warp=mix(warp,fbm(p*1.8+q*1.4-t*0.6),0.5);",
  // breath: contrast & warmth
  "float br=uBreath;",
  "float m=smoothstep(0.2,0.95,warp+0.12*br);",
  // pastel ramp
  "vec3 lilac=vec3(0.85,0.78,0.94);vec3 sky=vec3(0.75,0.89,0.93);",
  "vec3 mint=vec3(0.82,0.93,0.88);vec3 peach=vec3(0.97,0.85,0.78);",
  "vec3 col=mix(lilac,sky,smoothstep(0.0,0.4,m));",
  "col=mix(col,mint,smoothstep(0.35,0.7,m));",
  "col=mix(col,peach,smoothstep(0.65,1.0,m));",
  // warm on inhale
  "col=mix(col,col*vec3(1.05,0.99,0.92),br*0.5);",
  // gold sun glow, blooms on inhale
  "vec2 sun=vec2(uRes.x/uRes.y*0.5,0.56);",
  "float d=distance(p,sun);",
  "float bloom=smoothstep(0.55+0.12*br,0.0,d);",
  "col+=vec3(0.95,0.78,0.42)*bloom*(0.18+0.16*br);",
  // lift + soften
  "col=mix(vec3(0.97,0.96,1.0),col,0.82);",
  "gl_FragColor=vec4(col,1.0);}"
  ].join("\n");

  function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)){console.warn(gl.getShaderInfoLog(o));}return o;}
  var prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(prog);gl.useProgram(prog);
  var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(prog,"p");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  var uRes=gl.getUniformLocation(prog,"uRes"),uTime=gl.getUniformLocation(prog,"uTime"),
      uBreath=gl.getUniformLocation(prog,"uBreath"),uWind=gl.getUniformLocation(prog,"uWind");

  var scale=0.7,DPR=Math.min(devicePixelRatio||1,1.5);
  function resize(){var w=innerWidth*DPR*scale,h=innerHeight*DPR*scale;cv.width=w;cv.height=h;gl.viewport(0,0,w,h);}
  resize();addEventListener("resize",resize);

  // pointer wind (damped)
  var windX=0,windY=0,tx=0,ty=0,lx=0,ly=0;
  addEventListener("pointermove",function(e){
    tx=(e.clientX/innerWidth-0.5);ty=(e.clientY/innerHeight-0.5);
    var dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
    windX+=dx*0.0008;windY+=dy*0.0008;
  },{passive:true});

  // breath clock 4s in, 6s out -> 10s
  var bw=document.getElementById("bw");var lastWord="";
  function breathAt(t){var ph=(t%10)/10; // 0..1
    // inhale 0..0.4 rising, hold tiny, exhale 0.4..1 falling
    var b;if(ph<0.4)b=ph/0.4;else b=1-(ph-0.4)/0.6;b=b*b*(3-2*b);
    var word=ph<0.42?"breathe in…":"breathe out…";
    if(word!==lastWord){lastWord=word;bw.textContent=word;}
    return b;}

  var start=performance.now();
  function frame(now){
    var t=(now-start)/1000;
    windX*=0.93;windY*=0.93;
    var b=reduce?0.5:breathAt(t);
    gl.uniform2f(uRes,cv.width,cv.height);
    gl.uniform1f(uTime,reduce?2.0:t);
    gl.uniform1f(uBreath,b);
    gl.uniform2f(uWind,windX,windY);
    gl.drawArrays(gl.TRIANGLES,0,3);
    if(!reduce)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // gold seeds
  if(!reduce){var sp=document.getElementById("seeds");for(var i=0;i<16;i++){var s=document.createElement("span");s.className="seed";s.style.left=Math.random()*100+"%";s.style.animationDuration=(13+Math.random()*13)+"s";s.style.animationDelay=(-Math.random()*20)+"s";s.style.transform="scale("+(.5+Math.random())+")";sp.appendChild(s);}}
})();
</script>
</body>
</html>
